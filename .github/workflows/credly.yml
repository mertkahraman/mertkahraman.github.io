# Credly rozetlerini haftada bir çeker; değişiklik varsa commit edip siteyi yeniden derletir.
# Elle çalıştırmak için: GitHub ▸ Actions ▸ "Credly sertifikaları" ▸ Run workflow
name: Credly sertifikaları

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Rozetleri çek
        run: ruby scripts/fetch_credly.rb

      - name: Değişiklik varsa commit et ve siteyi yeniden derlet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/certifications.json; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/certifications.json
          git commit -m "Credly sertifikalarını güncelle"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
